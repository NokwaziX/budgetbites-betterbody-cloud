<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBites - BetterBody</title>
    <style>
        :root {
            --bg: #f5f3ea;
            --card: #ffffff;
            --ink: #1c1c1c;
            --muted: #666666;
            --accent: #b6f23a;
            --border: #d9d6c8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
        h1 { margin-bottom: 4px; }
        .subtitle { color: var(--muted); margin-top: 0; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; }
        .full { grid-column: 1 / -1; }
        button {
            background: var(--accent);
            border: 1px solid var(--ink);
            border-radius: 8px;
            padding: 12px 20px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: wait; }
        .error { color: #b00020; margin-top: 12px; white-space: pre-line; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
        @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; }
        .stat strong { display: block; font-size: 1.4rem; }
        .meal { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
        .meal h3 { margin: 0 0 4px; }
        .tag { color: var(--muted); font-size: 0.85rem; }
        ul, ol { margin: 6px 0; padding-left: 20px; }
        #preview { max-width: 200px; border-radius: 8px; margin-top: 8px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
<main>
    <h1>BudgetBites - BetterBody</h1>
    <p class="subtitle">Your calorie plan and budget meal ideas, built from what you already have.</p>

    <div class="card">
        <h2>About you</h2>
        <div class="grid">
            <div>
                <label for="currentWeight">Current weight (kg)</label>
                <input type="number" id="currentWeight" min="30" max="300" step="0.1">
            </div>
            <div>
                <label for="goalWeight">Goal weight (kg)</label>
                <input type="number" id="goalWeight" min="30" max="300" step="0.1">
            </div>
            <div>
                <label for="height">Height (cm)</label>
                <input type="number" id="height" min="100" max="250">
            </div>
            <div>
                <label for="age">Age (years)</label>
                <input type="number" id="age" min="18" max="80">
            </div>
            <div>
                <label for="sex">Biological sex</label>
                <select id="sex">
                    <option value="">Select</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div>
                <label for="activity">Activity level</label>
                <select id="activity">
                    <option value="sedentary">Sedentary (little or no exercise)</option>
                    <option value="light">Light (1-3 days a week)</option>
                    <option value="moderate">Moderate (3-5 days a week)</option>
                    <option value="very_active">Very active (6-7 days a week)</option>
                    <option value="extra_active">Extra active (hard training or physical job)</option>
                </select>
            </div>
            <div>
                <label for="pace">Weight loss pace</label>
                <select id="pace">
                    <option value="0.25">Slow (0.25 kg per week)</option>
                    <option value="0.5" selected>Steady (0.5 kg per week)</option>
                    <option value="0.75">Faster (0.75 kg per week)</option>
                    <option value="1">Fastest (1 kg per week)</option>
                </select>
            </div>
            <div>
                <label for="weeklyBudgetZar">Weekly food budget in rand (optional)</label>
                <input type="number" id="weeklyBudgetZar" min="50" max="10000">
            </div>
            <div class="full">
                <label for="pantry">What is in your fridge and pantry?</label>
                <textarea id="pantry" maxlength="1500" placeholder="eggs, rice, canned beans, frozen veg, oats, peanut butter, bananas, chicken thighs, pasta, canned tuna"></textarea>
            </div>
            <div class="full">
                <label for="mealPhoto">Photo of a meal (optional)</label>
                <input type="file" id="mealPhoto" accept="image/*">
                <img id="preview" alt="Meal preview">
            </div>
        </div>
        <p>
            <button id="generateBtn" type="button">Generate my plan</button>
        </p>
        <div id="error" class="error"></div>
    </div>

    <div id="results" class="hidden"></div>
</main>
<script src="script.js"></script>
</body>
</html>
